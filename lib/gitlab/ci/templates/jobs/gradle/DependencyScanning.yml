include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - remote: https://raw.githubusercontent.com/chesapeaketechnology/gitlab-templates/release/5/lib/gitlab/ci/templates/references/gradle/GradleJavaBase.yml

# TODO: Need to be moved to the following since old job being deprecated come Gitlab 19
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Jobs/Dependency-Scanning.v2.gitlab-ci.yml.
gemnasium-maven-dependency_scanning:
  extends:
    # Since extending for .gradle_java_base also have to extend for .ds-analyzer and .cyclonedx-reports
    # from https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Jobs/Dependency-Scanning.gitlab-ci.yml#L121
    - .ds-analyzer
    - .cyclonedx-reports
    - .gradle_java_base
  variables:
    PRINT_GITLAB_CICD_VARIABLES:
      value: "false"
      description: "When set to \"true\", prints all GitLab CI/CD variables for debugging purposes."
  before_script:
    - if [[ "$PRINT_GITLAB_CICD_VARIABLES" =~ ^(true|True|TRUE|yes|Yes|YES|1)$ ]]; then echo "Printing all GitLab CI/CD variables:"; env; fi
    - chmod +x gradlew
  artifacts:
    reports:
      dependency_scanning:
        - gl-dependency-scanning-report.json
      cyclonedx: "**/gl-sbom-*.cdx.json"
    paths:
      - gl-dependency-scanning-report.json
      - "**/gl-sbom-*.cdx.json"
  rules:
    - if: '$MAVEN_DETECTION_DISABLED =~ /true/i'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_BRANCH =~ $DEV_OR_RELEASE_REGEX'
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "parent_pipeline" || $CI_PIPELINE_SOURCE == "pipeline")


dependency_scanning_validation:
  stage: report_processing
  image: "${IMAGE_PREFIX}python:3.11-rc-alpine"
  needs: [ "gemnasium-maven-dependency_scanning" ]
  allow_failure: true
  variables:
    PRINT_GITLAB_CICD_VARIABLES:
      value: "false"
      description: "When set to \"true\", prints all GitLab CI/CD variables for debugging purposes."
  script:
    - if [[ "$PRINT_GITLAB_CICD_VARIABLES" =~ ^(true|True|TRUE|yes|Yes|YES|1)$ ]]; then echo "Printing all GitLab CI/CD variables:"; env; fi
    - ls
    - test -e gl-dependency-scanning-report.json || exit 0
    - wget https://raw.githubusercontent.com/chesapeaketechnology/gitlab-templates/release/5/lib/gitlab/ci/templates/references/security/validate_security_scan.py
    - wget https://raw.githubusercontent.com/chesapeaketechnology/gitlab-templates/release/5/lib/gitlab/ci/templates/references/security/convert_json_to_html.py
    - pip install json2html
    - python3 convert_json_to_html.py gl-dependency-scanning-report.json
    - python3 validate_security_scan.py gl-dependency-scanning-report.json $EXCLUDED_VULNERABILITY_PACKAGES
  artifacts:
    when: always
    paths:
      - gl-dependency-scanning-report.html
  rules:
    - if: '$MAVEN_DETECTION_DISABLED =~ /true/i'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_IID
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: '$CI_COMMIT_BRANCH =~ $DEV_OR_RELEASE_REGEX'
      when: always
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "parent_pipeline" || $CI_PIPELINE_SOURCE == "pipeline")
      when: always
