include:
  - remote: https://raw.githubusercontent.com/chesapeaketechnology/gitlab-templates/release/5/lib/gitlab/ci/templates/references/gradle/GradleJavaBase.yml

quality_check:
  extends: .gradle_java_base
  stage: test
  variables:
    PRINT_GITLAB_CICD_VARIABLES: "false"
  script:
    - if [[ "$PRINT_GITLAB_CICD_VARIABLES" =~ ^(true|True|TRUE|yes|Yes|YES|1)$ ]]; then echo "Printing all GitLab CI/CD variables:"; env; fi
    - chmod +x gradlew
    - ./gradlew $QUALITY_CHECK_GRADLE_TASKS
  artifacts:
    paths:
      - "**/pmd/**.html"
      - "**/code-climate-file.json"
  rules:
    - if: '$QUALITY_CHECK_DISABLED =~ /true/i'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_BRANCH =~ $DEV_OR_RELEASE_REGEX'
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "parent_pipeline" || $CI_PIPELINE_SOURCE == "pipeline")

quality_reporting:
  image: "${IMAGE_PREFIX}python:3.11-rc-alpine"
  stage: report_processing
  needs: [quality_check]
  variables:
    PRINT_GITLAB_CICD_VARIABLES: "false"
  script:
    - |
      case "$PRINT_GITLAB_CICD_VARIABLES" in
        true|True|TRUE|yes|Yes|YES|1)
          echo "Printing all GitLab CI/CD variables:"
          env
          ;;
      esac
    - wget https://raw.githubusercontent.com/chesapeaketechnology/gitlab-templates/release/5/lib/gitlab/ci/templates/references/quality/generate_merged_quality_report.py
    - python3 generate_merged_quality_report.py
  artifacts:
    reports:
      codequality:
        - "**/merged-code-climate-file.json"
  rules:
    - if: '$QUALITY_CHECK_DISABLED =~ /true/i'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_BRANCH =~ $DEV_OR_RELEASE_REGEX'
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "parent_pipeline" || $CI_PIPELINE_SOURCE == "pipeline")
