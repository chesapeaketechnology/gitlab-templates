include:
  - remote: https://raw.githubusercontent.com/chesapeaketechnology/gitlab-templates/release/4/lib/gitlab/ci/templates/references/gradle/GradleJavaBase.yml

dependency_license_scanning:
  extends: .gradle_java_base
  stage: test
  script:
    - chmod +x gradlew
    - ./gradlew checkLicense
  artifacts:
    when: always
    paths:
      - "**/dependency-license/**"
  rules:
    - if: '$DEPENDENCY_LICENSE_SCANNING_DISABLED =~ /true/i'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_BRANCH =~ $DEV_OR_RELEASE_REGEX'
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "parent_pipeline" || $CI_PIPELINE_SOURCE == "pipeline")
