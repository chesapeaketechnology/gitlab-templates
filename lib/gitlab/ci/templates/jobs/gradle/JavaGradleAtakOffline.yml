variables:
  JAVA_GRADLE_ATAK_OFFLINE_IMAGE_PREFIX: ""
  JAVA_GRADLE_ATAK_OFFLINE_DEFAULT_IMAGE: "theimpulson/gitlab-ci-android:android-35"

# Setup ATAK dependencies before running jobs
.template-gradle-atak-repos:
  variables:
    ATAK_DEV_REPO_URL: ""
    ATAK_TOOL_REPO_URL: ""
    STANDARD_GRADLE_FLAGS: '-s --no-daemon -PnoMavenLocal --refresh-dependencies --console=plain'
    EXTRA_GRADLE_FLAGS: "--init-script .gradle/init.d/ci-atak-repos.gradle"
    GRADLE_FLAGS: "$STANDARD_GRADLE_FLAGS $EXTRA_GRADLE_FLAGS"
  image: ${JAVA_GRADLE_ATAK_OFFLINE_IMAGE_PREFIX}$JAVA_GRADLE_ATAK_OFFLINE_DEFAULT_IMAGE
  interruptible: true
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/wrapper
      - .gradle/caches
  script:
    # Setup gradlew permissions in case it is not already executable
    - chmod +x gradlew
    - mkdir -p .gradle/init.d
    - |
      cat > .gradle/init.d/ci-atak-repos.gradle <<'EOF'
      allprojects {
        buildscript {
            ext.taktoolrepoUrl = System.getenv("ATAK_TOOL_REPO_URL")
            ext.takrepoUrl = System.getenv("ATAK_DEV_REPO_URL")
            ext.takrepoUser = System.getenv("ARTIFACT_REPO_USERNAME")
            ext.takrepoPassword = System.getenv("ARTIFACT_REPO_PASSWORD")
            repositories {
                maven {
                    url takrepoUrl
                    credentials {
                        username = System.getenv("ARTIFACT_REPO_USERNAME")
                        password = System.getenv("ARTIFACT_REPO_PASSWORD")
                    }
                }
                maven {
                    url taktoolrepoUrl
                    credentials {
                        username = System.getenv("ARTIFACT_REPO_USERNAME")
                        password = System.getenv("ARTIFACT_REPO_PASSWORD")
                    }
                }
            }
        }
      }
      EOF
    - |
      cat > local.properties <<EOF
      takrepo.url=${ATAK_DEV_REPO_URL}
      takrepo.user=${ARTIFACT_REPO_USERNAME}
      takrepo.password=${ARTIFACT_REPO_PASSWORD}
      EOF

.template-gradle-assemble-plugin:
  extends: .template-gradle-atak-repos
  stage: build
  interruptible: true
  variables:
    ASSEMBLE_GRADLE_TASK: ""
  script:
    - !reference [.template-gradle-atak-repos, script] #setup atak repos
    - ./gradlew $GRADLE_FLAGS ${ASSEMBLE_GRADLE_TASK} #perform task
  artifacts:
    expire_in: 336h
    paths:
      - app/build/outputs/apk

.template-gradle-test-plugin:
  extends: .template-gradle-atak-repos
  stage: test
  variables:
    TEST_GRADLE_TASK: ""
  script:
    - !reference [.template-gradle-atak-repos, script] #setup atak repos
    - ./gradlew $GRADLE_FLAGS ${TEST_GRADLE_TASK} #perform task
  artifacts:
    when: always
    expire_in: 1 days
    paths:
      # Speed up Gitlab jobs after this one by saving build artifacts
      - "**/build/**"
    reports:
      junit:
        - "**/TEST-*.xml"

.template-gradle-lint-plugin:
  extends: .template-gradle-atak-repos
  stage: test
  variables:
    LINT_GRADLE_TASK: ""
  script:
    - !reference [.template-gradle-atak-repos, script] #setup atak repos
    - ./gradlew $GRADLE_FLAGS ${LINT_GRADLE_TASK} #perform task
  after_script:
    - echo "copying lint results to gitlab pages so html can be viewed easily in a Gitlab artifact"
    - public_dir_tmp=$CI_PROJECT_DIR/../public
    - public_dir_final=$CI_PROJECT_DIR/public
    - mkdir -p $public_dir_final
    - mv $public_dir_final $public_dir_tmp
    - destination=$(cd -- "$public_dir_tmp" && pwd) # make it an absolute path
    - echo $destination
    - |+
      cd -- "$CI_PROJECT_DIR" &&
      find . -name "lint-results-debug.html" -exec sh -c '
      mkdir -p "$0/${1%/*}"
      cp "$1" "$0/$1"
      ' "$destination" {} \;
    - mv $public_dir_tmp $public_dir_final
  artifacts:
    expire_in: 1 days
    paths:
      - "**/lint-results-*.html"
      - public
    when: always
  allow_failure: true