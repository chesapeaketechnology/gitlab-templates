variables:
  USE_DOCKER_AUTH_CONFIG: "true"
  DOCKER_DIRECTORY: $CI_PROJECT_DIR
  DOCKERFILE: Dockerfile
  OVERWRITABLE_TAG_REGEX: \-rc\.[0-9]$
  DOCKER_BUILD_ARGS: ""

# kaniko_publish: Builds and pushes Docker images using Kaniko in GitLab CI/CD.
# It handles both `latest` and versioned tags, and prevents overwriting immutable tags.
.kaniko_publish:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  script:
    - |
      docker_build_args_flag=""
      if [ -z "${DOCKER_BUILD_ARGS}" ]; then
        echo "DOCKER_BUILD_ARGS is either not set or empty"
      else
        echo "DOCKER_BUILD_ARGS is set and not empty"
        for docker_build_arg in $DOCKER_BUILD_ARGS; do
          echo "adding build arg of $docker_build_arg"
          docker_build_args_flag="$docker_build_args_flag --build-arg $docker_build_arg "
        done
      fi
    - echo "Created kaniko build arguments $docker_build_args_flag"
    - if [[ $DOCKER_DIRECTORY ]]; then cd $DOCKER_DIRECTORY; fi;
    - mkdir -p /kaniko/.docker
    - if [ -f "${REGISTRY_CRT}" ]; then cat "${REGISTRY_CRT}" >> /kaniko/ssl/certs/ca-certificates.crt; fi # supports self-signed registry
    - if [ $USE_DOCKER_AUTH_CONFIG = "true" ]; then echo "${DOCKER_AUTH_CONFIG}" > /kaniko/.docker/config.json; else echo "{\"auths\":{\"$DOCKER_REPO_HOSTNAME\":{\"username\":\"$DOCKER_REPO_USERNAME\",\"password\":\"$DOCKER_REPO_PASSWORD\"}}}" > /kaniko/.docker/config.json; fi

    - |
      if [ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]; then
          echo "pushing a latest tagged docker image since on default branch"
          /kaniko/executor --context $DOCKER_DIRECTORY --dockerfile $DOCKERFILE --destination $DOCKER_REPO_HOSTNAME/$DOCKER_REPO_NAME/$APP_NAME:latest $docker_build_args_flag
      fi

    - |
      if ! echo "$VERSION" | grep -q -E "$OVERWRITABLE_TAG_REGEX"; then
          echo "the Docker tag is not considered overwritable, checking if Docker image already exists in repository because we don't want to overwrite tags that aren't $OVERWRITABLE_TAG_REGEX"
          dockerfile_to_test_if_image_tag_exists=test-image-tag-exists.Dockerfile
          touch $dockerfile_to_test_if_image_tag_exists
          echo FROM $DOCKER_REPO_HOSTNAME/$DOCKER_REPO_NAME/$APP_NAME:$VERSION > $dockerfile_to_test_if_image_tag_exists
          echo "checking if image exists already, will exit and fail Gitlab job if the image already exists"
          /kaniko/executor --context $DOCKER_DIRECTORY --dockerfile $dockerfile_to_test_if_image_tag_exists $docker_build_args_flag --no-push > /dev/null && exit 1 || true
          echo "image doesn't exist, continuing on"
      fi

    - echo "Pushing docker image with version $VERSION"
    - /kaniko/executor --context $DOCKER_DIRECTORY --dockerfile $DOCKERFILE --destination $DOCKER_REPO_HOSTNAME/$DOCKER_REPO_NAME/$APP_NAME:$VERSION $docker_build_args_flag
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# kaniko_publish_arm: Extends the standard Kaniko publish job for ARM-based architectures.
# This job inherits all logic from `.kaniko_publish` and customizes execution by using a specific GitLab runner tag.
# The tag `architecture-aarch64` ensures that the job runs on an ARM64 (AArch64) compatible GitLab runner.
#
# Use Case:
# - When building Docker images for ARM-based environments such as AWS Graviton, Apple M1/M2 chips, or Jetson devices.
# - Ensures proper architecture targeting during multi-arch image builds or ARM-specific deployments.
kaniko_publish_arm:
  extends: .kaniko_publish
  tags:
    - architecture-aarch64

# Standalone multiarch manifest job with its own variables
multiarch_manifest_publish:
  stage: publish
  image: docker:24.0.5
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    AMD_IMAGE: "harbor.ctic-dev.com/platform-engineering/getting-started:0.1.2"
    ARM_IMAGE: "harbor.ctic-dev.com/platform-engineering/getting-started:0.1.5"
    MULTIARCH_IMAGE: "harbor.ctic-dev.com/platform-engineering/getting-started:0.1.5-multiarch"
    HARBOR_URL: "https://harbor.ctic-dev.com"
  before_script:
    - echo "$HARBOR_ROBOT_PASSWORD" | docker login --username "$HARBOR_ROBOT_USERNAME" --password-stdin "$HARBOR_URL"
  script:
    - |
      set -e
      echo "🔧 Creating manifest from:"
      echo " - $AMD_IMAGE"
      echo " - $ARM_IMAGE"
      echo "=> $MULTIARCH_IMAGE"

      docker manifest create "$MULTIARCH_IMAGE" \
        --amend "$AMD_IMAGE" \
        --amend "$ARM_IMAGE"

      docker manifest push "$MULTIARCH_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'