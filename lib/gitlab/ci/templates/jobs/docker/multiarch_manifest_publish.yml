







# Standalone multiarch manifest job with its own variables
multiarch_manifest_publish:
  stage: publish
  image: docker:24.0.5
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    AMD_IMAGE: ""
    ARM_IMAGE: ""
    MULTIARCH_IMAGE: ""
    DOCKER_REPO_HOSTNAME: ""
  script:
    - |
      echo "$DOCKER_REPO_PASSWORD" | docker login $DOCKER_REPO_HOSTNAME -u $DOCKER_REPO_USERNAME --password-stdin
      set -e
      echo "🔧 Creating manifest from:"
      echo " - $AMD_IMAGE"
      echo " - $ARM_IMAGE"
      echo "=> $MULTIARCH_IMAGE"

      docker manifest create "DOCKER_REPO_HOSTNAME/$MULTIARCH_IMAGE" \
        --amend "DOCKER_REPO_HOSTNAME/$AMD_IMAGE" \
        --amend "DOCKER_REPO_HOSTNAME/$ARM_IMAGE"

      docker manifest push "$DOCKER_REPO_HOSTNAME/$MULTIARCH_IMAGE"
  rules:
    - when: always

