variables:
  GIT_TASKS_ENABLED: "true"

  DEV_REGEX: '^develop$|^main$'
  RELEASE_REGEX: '^[0-9]+\.[0-9]+$|^release\/.+$'
  DEV_OR_RELEASE_REGEX: '^develop$|^main$|^[0-9]+\.[0-9]+$|^release\/.+$'

# ───────────────────────── Docs jobs ─────────────────────────
pages_generate:
  stage: publish
  rules: &pages_rules
    - if: '$FORCE_PUBLISH_PAGES =~ /true/i'
    - if: '$PUBLISH_RUSTDOCS_DISABLED =~ /true/i'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_BRANCH =~ /^develop$|^main$|^[0-9]+\.[0-9]+$|^release\/.+$/'
  script:
    - echo "CI Pipeline Source = '$CI_PIPELINE_SOURCE'"
    - cargo doc --no-deps --workspace
  artifacts:
    paths: [target/doc]

pages:
  image: "${IMAGE_PREFIX}python:3.11-rc-alpine"
  stage: deploy
  rules: *pages_rules
  script:
    - echo "CI Pipeline Source = '$CI_PIPELINE_SOURCE'"
    - rm -rf public && mkdir -p public/rustdocs
    - cp -R target/doc/* public/rustdocs
    - printf '<html><body><h1><a href="./rustdocs/index.html">Rust Docs</a></h1></body></html>' > public/index.html
  artifacts:
    paths: [public]

# ───────── Shared prereqs for publish jobs ─────────
# this is an **array** anchor so we can append more lines later
.cargo_setup: &cargo_setup
  - apt-get update -qq
  - apt-get install -y --no-install-recommends jq pkg-config libssl-dev git
  - mkdir -p .cargo
  - |
    cat > .cargo/config.toml <<'CFG'
    [registries.sis]
    index = "https://artifactory.ctic-dev.com/artifactory/api/cargo/sis-cargo/index"
    CFG
  - echo "https://${ARTIFACT_REPO_USERNAME}:${ARTIFACT_REPO_PASSWORD}@artifactory.ctic-dev.com" > /tmp/git-cred
  - git config --global credential.helper "store --file=/tmp/git-cred"
  - export CARGO_REGISTRIES_SIS_TOKEN="$ARTIFACT_REPO_PASSWORD"
  - export CARGO_NET_GIT_FETCH_WITH_CLI=true

# ───────── Snapshot publish ─────────
publish_snapshot_crate:
  stage: publish
  image: rust:1.87-slim
  before_script: *cargo_setup

  script: |
    set -euo pipefail
    echo "CI Pipeline Source = '${CI_PIPELINE_SOURCE}'"

    mapfile -t MANIFESTS < <(
      cargo metadata --format-version 1 --no-deps |
      jq -r '.packages[]
             | select((.publish == null) or (.publish|type=="array" and length>0))
             | .manifest_path'
    )

    for MANIFEST in "${MANIFESTS[@]}"; do
      CRATE_DIR=$(dirname "${MANIFEST}")
      echo "Publishing ${CRATE_DIR}"
      ( cd "${CRATE_DIR}" && cargo publish --allow-dirty --no-verify )
    done

  after_script:
    - rm -f /tmp/git-cred || true
    - git config --global --unset credential.helper || true

  rules:
    - if: '$PUBLISH_SNAPSHOT_CRATE_DISABLED =~ /true/i'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^develop$|^main$/'
    - if: '$FORCE_PUBLISH_SNAPSHOT_CRATE =~ /true/i'

# ───────── Release publish ─────────
publish_release_crate:
  stage: publish
  image: rust:1.87-slim
  before_script:
    - *cargo_setup         # shared steps
    - cargo install cargo-release@^0.25 || true

  script: |
    set -euo pipefail
    if [[ -n "${CI_COMMIT_TAG}" ]]; then
      echo "Tag build → release"
    elif [[ ! "${CI_COMMIT_BRANCH}" =~ ^develop$|^main$|^[0-9]+\.[0-9]+$|^release/.+$ ]]; then
      echo "Refusing to release from ${CI_COMMIT_BRANCH}"
      exit 1
    fi

    if [[ $(echo "${RELEASE:-}" | tr '[:upper:]' '[:lower:]') == "final" ]]; then
      cargo release --no-confirm --no-dev-version
    else
      cargo release --no-confirm --release-candidate "${RELEASE:-rc}"
    fi

  after_script:
    - rm -f /tmp/git-cred || true
    - git config --global --unset credential.helper || true

  rules:
    - if: '$PUBLISH_RELEASE_CRATE_DISABLED =~ /true/i'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE
    - if: $FORCE_PUBLISH_RELEASE_CRATE == "true"