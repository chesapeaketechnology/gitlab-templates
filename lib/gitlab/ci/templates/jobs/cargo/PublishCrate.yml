# ───────────────────────── reusable rule set ─────────────────────────
pages_rules: &pages_rules
  - if: '$FORCE_PUBLISH_PAGES =~ /true/i'
  - if: '$PUBLISH_RUSTDOCS_DISABLED =~ /true/i'
    when: never
  - if: $CI_COMMIT_TAG
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: '$CI_COMMIT_BRANCH =~ $DEV_OR_RELEASE_REGEX'

# ───────────────────────── top-level variables ───────────────────────
variables:
  GIT_TASKS_ENABLED: "true"

  DEV_REGEX: '^develop$|^main$'
  RELEASE_REGEX: '^[0-9]+\.[0-9]+$|^release\/.+$'
  DEV_OR_RELEASE_REGEX: "$DEV_REGEX|$RELEASE_REGEX"

  RELEASE:
    value: ""
    description: |
      Leave blank to build a snapshot.
      Use FINAL for a final release, or any other value (e.g. rc1) for an RC.

  RELEASE_CARGO_FLAGS:
    value: ""
    description: "Extra flags passed to cargo-release (optional)."

  FINAL_RELEASE_PATCH_TASK:
    value: "rollPatchVersion"
    description: |
      How to bump the version after a FINAL release:
      rollPatchVersion or rollMinorVersion.

# ─────────────────────────── documentation jobs ──────────────────────
pages_generate:
  stage: publish
  rules: *pages_rules
  script:
    - echo "CI Pipeline Source = '$CI_PIPELINE_SOURCE'"
    - cargo doc --no-deps --workspace
  artifacts:
    paths: [target/doc]

pages:
  image: "${IMAGE_PREFIX}python:3.11-rc-alpine"
  stage: deploy
  rules: *pages_rules
  script:
    - echo "CI Pipeline Source = '$CI_PIPELINE_SOURCE'"
    - rm -rf public && mkdir -p public/rustdocs
    - cp -R target/doc/* public/rustdocs
    - printf '<html><body><h1><a href="./rustdocs/index.html">Rust Docs</a></h1></body></html>' > public/index.html
  artifacts:
    paths: [public]

# ───────────────────── snapshot publish (dev branches) ───────────────
publish_snapshot_crate:
  stage: publish
  image: rust:1.87-slim

  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends jq pkg-config libssl-dev git
    - mkdir -p ~/.cargo
    - |
      cat > ~/.cargo/config.toml <<'CFG'
      [registries.sis]
      index = "https://artifactory.ctic-dev.com/artifactory/api/cargo/sis-cargo/index.git"
      CFG
    - export CARGO_REGISTRIES_SIS_TOKEN="$CARGO_ARTIFACTORY_TOKEN"
    - echo "https://token:${CARGO_ARTIFACTORY_TOKEN}@artifactory.ctic-dev.com" > /tmp/git-cred
    - git config --global credential.helper "store --file=/tmp/git-cred"
    - export CARGO_NET_GIT_FETCH_WITH_CLI=true

  script: |
    set -euo pipefail
    echo "CI Pipeline Source = '${CI_PIPELINE_SOURCE}'"

    if [[ ! "${CI_COMMIT_BRANCH}" =~ ${DEV_REGEX} ]]; then
      echo "Not a dev branch — skipping snapshot publish"
      exit 0
    fi

    mapfile -t MANIFESTS < <(
      cargo metadata --format-version 1 --no-deps |
      jq -r '.packages[]
             | select((.publish == null) or (.publish|type=="array" and length>0))
             | .manifest_path'
    )

    for MANIFEST in "${MANIFESTS[@]}"; do
      CRATE_DIR=$(dirname "${MANIFEST}")
      echo "Publishing ${CRATE_DIR}"
      ( cd "${CRATE_DIR}" && cargo publish --allow-dirty --no-verify --registry sis )
    done

  after_script:
    - rm -f /tmp/git-cred

  rules:
    - if: '$PUBLISH_SNAPSHOT_CRATE_DISABLED =~ /true/i'
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: '$CI_COMMIT_BRANCH =~ $DEV_REGEX'
    - if: '$FORCE_PUBLISH_SNAPSHOT_CRATE =~ /true/i'

# ───────────────────── release publish (tags / web) ──────────────────
publish_release_crate:
  stage: publish
  image: rust:1.87-slim

  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends jq pkg-config libssl-dev git
    - cargo install cargo-release@^0.25 || true
    - mkdir -p ~/.cargo
    - |
      cat > ~/.cargo/config.toml <<'CFG'
      [registries.sis]
      index = "https://artifactory.ctic-dev.com/artifactory/api/cargo/sis-cargo/index.git"
      CFG
    - export CARGO_REGISTRIES_SIS_TOKEN="$CARGO_ARTIFACTORY_TOKEN"
    - echo "https://token:${CARGO_ARTIFACTORY_TOKEN}@artifactory.ctic-dev.com" > /tmp/git-cred
    - git config --global credential.helper "store --file=/tmp/git-cred"
    - export CARGO_NET_GIT_FETCH_WITH_CLI=true

  script: |
    set -euo pipefail

    if [[ -n "${CI_COMMIT_TAG}" ]]; then
      echo "Tag build → release"
    elif [[ ! "${CI_COMMIT_BRANCH}" =~ ${DEV_OR_RELEASE_REGEX} ]]; then
      echo "Refusing to release from ${CI_COMMIT_BRANCH}"
      exit 1
    fi

    if [[ $(echo "${RELEASE:-}" | tr '[:upper:]' '[:lower:]') == "final" ]]; then
      cargo release --registry sis --no-confirm --no-dev-version ${RELEASE_CARGO_FLAGS}
    else
      cargo release --registry sis --no-confirm --release-candidate "${RELEASE:-rc}" ${RELEASE_CARGO_FLAGS}
    fi

  after_script:
    - rm -f /tmp/git-cred

  rules:
    - if: '$PUBLISH_RELEASE_CRATE_DISABLED =~ /true/i'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web" && $RELEASE
    - if: $FORCE_PUBLISH_RELEASE_CRATE == "true"

# ─────────────────────────── version roll job ────────────────────────
roll_project_version:
  stage: repo_management
  script:
    - apt-get update && apt-get -y install git
    - git checkout -q -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - cargo install cargo-release --version '^0.25' || true
    - |
      if [[ "$FINAL_RELEASE_PATCH_TASK" == "bump_minor_version" ]]; then
        cargo release minor --skip-publish --no-push --no-confirm
      else
        cargo release patch  --skip-publish --no-push --no-confirm
      fi
  rules:
    - if: '$ROLL_PROJECT_VERSION_DISABLED =~ /true/i'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE == "final"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE == "FINAL"'
    - if: '$FORCE_ROLL_PROJECT_VERSION =~ /true/i'
