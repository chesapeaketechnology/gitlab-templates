variables:
  TASK_ARGUMENTS:
    value: ""
    description: "Add any additional gradle commands for this build here. ex: \"-Pforce -x someTask\""
  RELEASE:
    value: 'false'
    description: Determines if a 'release' build will be performed, which also publishes the plugin to the Gradle Plugin Portal.  Use 'true' to perform a release build.
  DEFAULT_IMAGE: ${TAK_REGISTRY_HOST}/openjdk:8-jdk-slim
  STANDARD_GRADLE_FLAGS: '-s --no-daemon -PnoMavenLocal --refresh-dependencies --console=plain $TASK_ARGUMENTS'
  GRADLE_TEST_FLAGS: "$STANDARD_GRADLE_FLAGS $EXTRA_GRADLE_TEST_FLAGS"

default:
  image: $DEFAULT_IMAGE
  interruptible: true

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - remote: https://raw.githubusercontent.com/chesapeaketechnology/gitlab-templates/release/4/lib/gitlab/ci/templates/jobs/gitlab/GitlabRelease.yml

stages:
  - test
  - deploy

test_java:
  stage: test
  script:
    - chmod +x gradlew
    - echo "Running tests with flags '$GRADLE_TEST_FLAGS'"
    - echo "CI_COMMIT_TAG = '$CI_COMMIT_TAG'"
    - ./gradlew test $GRADLE_TEST_FLAGS
  artifacts:
    when: always
    reports:
      junit:
        - "**/TEST-*.xml"
    expire_in: 1 days
  rules:
    - if: $TEST_JAVA_DISABLED
      when: never
    # Don't build when tags are committed
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

pages:
  stage: deploy
  rules:
    - if: $PAGES_DISABLED
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'web' && $RELEASE == 'true'
  script:
    - chmod +x gradlew
    - rm -rf public
    - mkdir public
    - ./gradlew $STANDARD_GRADLE_FLAGS -Prelease copyDocsToPages
  artifacts:
    paths:
      - public

doRelease:
  stage: deploy
  rules:
    - if: $DO_RELEASE_DISABLED
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == 'web' && $RELEASE == 'true'
  script:
    - chmod +x gradlew
    - ./gradlew -Prelease doRelease

# Override default rules and artifacts at
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Jobs/Secret-Detection.gitlab-ci.yml
secret_detection:
  rules:
    - if: $SECRET_DETECTION_DISABLED == 'true' || $SECRET_DETECTION_DISABLED == '1'
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
    paths:
      - gl-secret-detection-report.json
