# ───────────── CargoPipeline.yml  (mirrors Gradle pipeline structure) ─────────────
variables:
  SAFE_TEST:
    value: "false"
    description: "Run tests only; skip publish when set to true."
  TASK_ARGUMENTS:
    value: ""
    description: "Extra cargo flags, e.g. \"--features foo,bar --locked\""
  BASE_CARGO_FLAGS: "-v $TASK_ARGUMENTS"
  STANDARD_CARGO_FLAGS: "$BASE_CARGO_FLAGS"
  DEV_REGEX: '^develop$|^main$'
  RELEASE_REGEX: '^[0-9]+\.[0-9]+$|^release\/.+$'
  DEV_OR_RELEASE_REGEX: "$DEV_REGEX|$RELEASE_REGEX"

default:
  image: rust:1.87-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure

cache:
  key: "$CI_PIPELINE_ID-cargo"
  paths:
    - target/
    - .cargo/registry/
  policy: pull-push

include:
  # unit-test + coverage
#  - remote: https://raw.githubusercontent.com/chesapeaketechnology/gitlab-templates/release/4/lib/gitlab/ci/templates/jobs/cargo/TestRust.yml
  # snapshot / release publish + optional docs
  - remote: https://raw.githubusercontent.com/chesapeaketechnology/gitlab-templates/release/4/lib/gitlab/ci/templates/jobs/cargo/PublishCrate.yml
  # (add Cargo-equivalent quality, pages, security templates when you create them)

stages:
  - test
  - report_processing
  - publish
  - deploy
  - repo_management

# TODO move to its own repo-hosted template file and put a remote: URL in the include: section

# 1. Build + unit tests
cargo-test:
  stage: test
  script:
    - cargo test $STANDARD_CARGO_FLAGS
  artifacts:
    when: always
    reports:
      junit: target/junit.xml    # produce with `cargo2junit` if you want test trend graphs

# 2. Clippy / audit / fmt reports (optional “report_processing” stage)
#cargo-quality:
#  stage: report_processing
#  script:
##    - rustup component add rustfmt clippy audit
##    - cargo fmt -- --check
##    - cargo clippy --all-targets --all-features -- -D warnings
##    - cargo audit
#  rules:
#    - if: '$QUALITY_CHECK_DISABLED =~ /true/i'
#      when: never
#    - when: on_success

workflow:
  rules:
    - if: '$SAFE_TEST =~ /true/i'
      variables:
        STANDARD_CARGO_FLAGS: '$BASE_CARGO_FLAGS --dry-run'
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_BRANCH =~ $DEV_OR_RELEASE_REGEX'
    - if: $CI_PIPELINE_SOURCE == "web"
